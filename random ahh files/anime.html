<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>anime.js v4</title>
    <style>
      .square {
        width: 50px;
        height: 50px;
        background: crimson;
        /* position: relative;  REMOVED - let anime handle positioning */
      }
      
      .gif {
        width: 100px;
        height: 100px;
        border-radius: 50px;
      }
      
      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        position: absolute;
        top: 50%;
        left: calc(10% - 50px);
        transform: translateY(-50%);
      }
      
      .line {
        width: 20px;
        height: 100vh;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgb(106, 255, 0);
      }
    </style>
  </head>
  <body>
    <div class="lne"></div>
    <div class="stack">
      <div class="square"></div>
      <div class="square"></div>
      <img
        class="gif"
        src="https://media1.tenor.com/m/RJKNPPCU9X8AAAAd/baby-sukuna.gif"
        alt="baby sukuna"
      />
      <div class="square"></div>
      <div class="square"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/animejs@4.4.1/dist/bundles/anime.umd.min.js"></script>

    <script>
      anime.animate(".square, .gif", {
        x: "80vw",
        rotate: { from: -360, },
        duration: 1000,
        delay: anime.stagger(70, { from: "center" }),
        ease: "inOutQuint",
        loop: true,
        alternate: true,
      });
    </script>
  </body>
</html>
